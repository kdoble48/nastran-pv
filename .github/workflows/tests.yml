name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # pyNastran 1.4.1 needs numpy < 2, which has no wheels past Python 3.12: these use main, at
          # the commit pinned in .github/pynastran-main.txt, installed first so `pip install -e .` keeps it
          - python: "3.13"
            pynastran: main
          - python: "3.14"
            pynastran: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/pynastran-main.txt
      - name: pyNastran main (pinned)
        if: matrix.pynastran == 'main'
        run: python -m pip install -r .github/pynastran-main.txt
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Lint
        shell: bash
        run: python -m pyflakes src paraview/*.py tests
      - name: Test
        # GITHUB_ACTOR is set, so pyNastran main runs its own self-checks (pyNastran.IS_CI) on every
        # OP2 the tests read, as it does in a user's GitHub Actions
        run: |
          python -c "import pyNastran, numpy, vtk; print('pyNastran', pyNastran.__version__, 'numpy', numpy.__version__, 'vtk', vtk.vtkVersion.GetVTKVersion())"
          python -m pytest -q -ra

  wheel:
    # the wheel alone (no clone, no NASTRAN_PV_PARAVIEW_DIR) must carry and find the ParaView plugin
    name: wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel from it, and a wheel straight from the tree
        run: |
          # stand-ins for a developer's vendored packages and caches: they must stay out of the wheel.
          # The sdist's wheel tests MANIFEST.in; the tree's wheel (as pip builds a clone) tests setup.py
          mkdir -p paraview/_vendor/scipy paraview/__pycache__ src/nastran_pv/__pycache__
          touch paraview/_vendor/scipy/__init__.py paraview/__pycache__/nastran_views.cpython-312.pyc \
                src/nastran_pv/__pycache__/cli.cpython-312.pyc
          # readme-renderer[md] renders the Markdown README as PyPI does (plain twine skips it)
          python -m pip install build twine "readme-renderer[md]"
          python -m build --outdir dist
          python -m build --wheel --outdir dist-tree
      - name: twine check --strict
        run: python -m twine check --strict dist/* dist-tree/*
      - name: The wheels carry the plugin, the sdist what MANIFEST.in promises, and nothing generated
        run: python tests/check_dists.py dist/* dist-tree/*.whl
      - name: Install it into a fresh venv and find the plugin there
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          bin="$RUNNER_TEMP/venv/bin"; [ -d "$bin" ] || bin="$RUNNER_TEMP/venv/Scripts"
          "$bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"   # outside the checkout
          unset NASTRAN_PV_PARAVIEW_DIR NASTRAN_PV_VENDOR_DIR
          "$bin/nastran-pv" setup --dry-run | tee setup.txt
          grep -E "^plugin: .*site-packages.nastran_pv.paraview.nastran_bdf_reader\.py" setup.txt
          "$bin/python" -c "
          from pathlib import Path
          import nastran_pv
          from nastran_pv import locate
          scripts = locate.paraview_scripts_dir()
          assert scripts == Path(nastran_pv.__file__).parent / 'paraview', scripts
          assert locate.is_installed_plugin_dir(scripts)
          vendor = locate.vendor_dir(python='3.12')
          assert vendor == locate.user_data_dir() / 'vendor' / 'py3.12', vendor
          print('plugin folder:', scripts)
          print('vendor folder:', vendor)
          "

  perf:
    # The performance budget (docs/performance.md#ci-check): stage times on a synthetic deck,
    # normalized by a calibration loop. One runner type and the versions RECORDED was measured with
    # (tests/perf-constraints.txt) keep the reference stable; -s prints each stage's ratio to the
    # log. Advisory: a failure shows on the PR for the reviewer but does not fail the run, so a
    # slow runner or an upstream slowdown cannot block a merge.
    name: performance budget (ubuntu / py3.12)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/perf-constraints.txt
      - name: Install
        run: python -m pip install -e ".[test]" -c tests/perf-constraints.txt
      - name: Performance budget
        run: python -m pytest -m perf -q -ra -s tests/test_performance.py
