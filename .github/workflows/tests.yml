name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # pyNastran 1.4.1 needs numpy < 2, which has no wheels past Python 3.12: these use main,
          # installed first so that `pip install -e .` keeps it
          - python: "3.13"
            pynastran: main
          - python: "3.14"
            pynastran: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: pyNastran main
        if: matrix.pynastran == 'main'
        run: python -m pip install "pyNastran @ git+https://github.com/SteveDoyle2/pyNastran.git@main"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Lint
        shell: bash
        run: python -m pyflakes src paraview/*.py tests
      - name: Test
        shell: bash
        # pyNastran main runs its developer self-checks when GITHUB_ACTOR is set (pyNastran.IS_CI), and
        # one of them (_check_result_slice) fails on the synthetic OP2; a user's install never sees it
        run: |
          python -c "import pyNastran, numpy, vtk; print('pyNastran', pyNastran.__version__, 'numpy', numpy.__version__, 'vtk', vtk.vtkVersion.GetVTKVersion())"
          env -u GITHUB_ACTOR python -m pytest -q -ra

  wheel:
    # the wheel alone (no clone, no NASTRAN_PV_PARAVIEW_DIR) must carry and find the ParaView plugin
    name: wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel from it, and a wheel straight from the tree
        run: |
          # stand-ins for a developer's vendored packages and caches: they must stay out of the wheel.
          # The sdist's wheel tests MANIFEST.in; the tree's wheel (as pip builds a clone) tests setup.py
          mkdir -p paraview/_vendor/scipy paraview/__pycache__ src/nastran_pv/__pycache__
          touch paraview/_vendor/scipy/__init__.py paraview/__pycache__/nastran_views.cpython-312.pyc \
                src/nastran_pv/__pycache__/cli.cpython-312.pyc
          python -m pip install build
          python -m build --outdir dist
          python -m build --wheel --outdir dist-tree
      - name: The wheels carry the plugin, the sdist what MANIFEST.in promises, and nothing generated
        run: |
          python -m zipfile -l dist/*.whl | grep nastran_pv/paraview/
          python tests/check_dists.py dist/* dist-tree/*.whl
      - name: Install it into a fresh venv and find the plugin there
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          bin="$RUNNER_TEMP/venv/bin"; [ -d "$bin" ] || bin="$RUNNER_TEMP/venv/Scripts"
          "$bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"   # outside the checkout
          unset NASTRAN_PV_PARAVIEW_DIR NASTRAN_PV_VENDOR_DIR
          "$bin/nastran-pv" setup --dry-run | tee setup.txt
          grep -E "^plugin: .*site-packages.nastran_pv.paraview.nastran_bdf_reader\.py" setup.txt
          "$bin/python" -c "
          from pathlib import Path
          import nastran_pv
          from nastran_pv import locate
          scripts = locate.paraview_scripts_dir()
          assert scripts == Path(nastran_pv.__file__).parent / 'paraview', scripts
          assert locate.is_installed_plugin_dir(scripts)
          vendor = locate.vendor_dir(python='3.12')
          assert vendor == locate.user_data_dir() / 'vendor' / 'py3.12', vendor
          print('plugin folder:', scripts)
          print('vendor folder:', vendor)
          "
