name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - name: Download gallery assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/_static/gallery
          # only a missing release is tolerated; any other failure must not deploy a gallery-less site
          if view=$(gh release view gallery-assets 2>&1); then
            gh release download gallery-assets -p gallery-assets.zip -D "$RUNNER_TEMP"
            unzip -q "$RUNNER_TEMP/gallery-assets.zip" -d docs/_static/gallery
          elif echo "$view" | grep -q "release not found"; then
            echo "::warning::gallery-assets release not found; building without the gallery"
          else
            echo "$view" >&2
            exit 1
          fi
      - run: python -m sphinx -W -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
