name: paraview

# pv_smoke in a real, headless ParaView on Linux, on both supported versions, with nastran-pv
# installed the way a user installs it: the wheel, then `nastran-pv setup` (which finds the
# ParaView unpacked in the home folder by itself).
on:
  pull_request:
    paths:
      - "paraview/**"
      - "src/**"
      - "tests/**"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/paraview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paraview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: pv_smoke / ParaView ${{ matrix.paraview }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 6.0 has a single Linux build: it picks X, EGL or its bundled OSMesa (lib/mesa) at run time
          - paraview: "6.0.1"
            url: https://www.paraview.org/files/v6.0/ParaView-6.0.1-MPI-Linux-Python3.12-x86_64.tar.gz
            apt: ""
          # 5.13 still ships separate headless builds; its libOSMesa needs the system's libglapi
          - paraview: "5.13.1"
            url: https://www.paraview.org/files/v5.13/ParaView-5.13.1-osmesa-MPI-Linux-Python3.10-x86_64.tar.gz
            apt: libglapi-mesa
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        if: matrix.apt != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.apt }}
      - name: Cache the ParaView download
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/paraview.tar.gz
          key: paraview-${{ matrix.url }}
      - name: Download ParaView ${{ matrix.paraview }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o ~/paraview.tar.gz "${{ matrix.url }}"
      - name: Unpack it into the home folder
        run: tar xzf ~/paraview.tar.gz -C ~ && ls -d ~/ParaView-*
      - name: Install nastran-pv from its wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv ~/venv
          # pv_smoke converts with this Python on ParaView 5.x: a VTK before 9.7, whose wedge winding
          # both ParaViews share (docs/install.md), and 9.5+ to write VTKHDF
          ~/venv/bin/python -m pip install "$(ls dist/*.whl)[h5]" "vtk>=9.5,<9.7"
      - name: nastran-pv setup
        run: |
          cd ~
          ~/venv/bin/nastran-pv setup 2>&1 | tee ~/setup.log
          grep "ParaView-${{ matrix.paraview }}" ~/setup.log | head -1
          ls ~/.config/ParaView/Macros | head -3
      - name: Diagnostics (temporary) - write the scripts
        if: matrix.paraview == '6.0.1'
        run: |
          cat > ~/exp.py <<'EOF'
          # beams.bdf only: write beams.vtkhdf (MODE: inproc, pvpython, venv, none), then run the first
          # parity filters on the deck reader and, unless MODE is none, on ParaView's reader of the file
          import os, subprocess, sys, tempfile
          sys.path.insert(0, os.path.abspath("tests"))
          import pv_smoke
          from paraview import simple as pv
          import nastran_views as nv
          mode = sys.argv[1]
          pv_smoke.rm.load_reader(pv_smoke.DECK)  # loads the plugin: nastran_pv and the vendored pyNastran
          deck = os.path.abspath("tests/data/beams.bdf")
          path = os.path.join(tempfile.mkdtemp(), "beams.vtkhdf")
          args = ["convert", deck, "-o", path, "-q"]
          vendor = os.environ["NASTRAN_PV_SITE_PACKAGES"]
          code = ("import sys; sys.path[:0] = ['src']; sys.path.append(%r); "
                  "from nastran_pv.cli import main; main(%r)" % (vendor, args))
          if mode == "inproc":
              from nastran_pv.cli import main
              main(args)
          elif mode == "pvpython":
              subprocess.check_call([os.environ["PVPYTHON"], "-c", code])
          elif mode == "venv":
              subprocess.check_call([os.environ["NASTRAN_PV_PYTHON"], "-m", "nastran_pv", *args],
                                    env=dict(os.environ, PYTHONPATH=os.path.abspath("src")))
          r = nv.load_reader(deck)
          inputs = [r] + ([nv.load_reader(path)] if mode != "none" else [])
          for rnd in range(4):
              for ctor, base, ports in pv_smoke.PARITY_FILTERS[:7]:
                  made = [getattr(pv, ctor)(Input=i, **base) for i in inputs]
                  for m in made:
                      m.UpdatePipeline()
                  for m in made:
                      pv.Delete(m)
                  print("round", rnd, ctor, flush=True)
          print("EXP OK", mode, flush=True)
          EOF
          cat > ~/pvrun.sh <<'EOF'
          pv=$(ls -d ~/ParaView-*/)
          export LD_LIBRARY_PATH="${pv}lib/mesa${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export NASTRAN_PV_SITE_PACKAGES="$(sed -n 's/^vendor folder: //p' ~/setup.log)" NASTRAN_PV_PYTHON=~/venv/bin/python
          export VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow PYTHONFAULTHANDLER=1 PVPYTHON="${pv}bin/pvpython"
          unset GITHUB_ACTOR
          "${pv}bin/pvpython" "$@" 2>&1 | grep -E "^(round|EXP)|Fatal|File \"|Segmentation|Abort|Error|error" | tail -25
          EOF
      - name: "E1 (temporary): write in process"
        if: matrix.paraview == '6.0.1'
        continue-on-error: true
        run: bash ~/pvrun.sh ~/exp.py inproc
      - name: "E2 (temporary): write in another pvpython"
        if: matrix.paraview == '6.0.1'
        continue-on-error: true
        run: bash ~/pvrun.sh ~/exp.py pvpython
      - name: "E3 (temporary): write with the venv"
        if: matrix.paraview == '6.0.1'
        continue-on-error: true
        run: bash ~/pvrun.sh ~/exp.py venv
      - name: "E4 (temporary): deck reader only"
        if: matrix.paraview == '6.0.1'
        continue-on-error: true
        run: bash ~/pvrun.sh ~/exp.py none
      - name: pv_smoke, headless
        env:
          VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow   # 6.0: OSMesa (the 5.13 osmesa build has only that)
          PYTHONFAULTHANDLER: "1"   # a crash prints the Python stack
        run: |
          pv=$(ls -d ~/ParaView-*/)
          vendor=$(sed -n 's/^vendor folder: //p' ~/setup.log)
          export LD_LIBRARY_PATH="${pv}lib/mesa${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # the checkout's plugin (../src), with the packages setup vendored for this ParaView
          export NASTRAN_PV_SITE_PACKAGES="$vendor" NASTRAN_PV_PYTHON=~/venv/bin/python
          # pyNastran main runs its developer self-checks when GITHUB_ACTOR is set (pyNastran.IS_CI), and
          # one of them (_check_result_slice) fails on the synthetic OP2; a user's ParaView never sees it
          env -u GITHUB_ACTOR "${pv}bin/pvpython" tests/pv_smoke.py
