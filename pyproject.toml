[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nastran-pv"
version = "0.1.0"
description = "Visualize Nastran decks and results in ParaView: properties, masses, bushes, loads, derived and mapped fields, run store"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# pyNastran: 1.4.1 (PyPI) on Python <= 3.12; Python 3.13+ needs main (1.5 dev), which pip
# then leaves alone: pip install "pyNastran @ git+https://github.com/SteveDoyle2/pyNastran.git@main"
# vtk: every nastran-pv command (setup included) imports vtkmodules. Never pip-install nastran-pv
# into ParaView's own Python: the plugin does not need it there and the vtk wheel would shadow
# ParaView's VTK.
dependencies = [
    "pyNastran>=1.4",
    "cpylog>=1.4",
    "numpy",
    "vtk>=9.3",
]

[project.optional-dependencies]
vtk = ["vtk>=9.3"]                    # kept so that `pip install ".[vtk]"` still works
h5 = ["h5py"]                         # MSC/NX HDF5 results
tables = ["pandas", "openpyxl"]       # Excel tables for --map
sql = ["pandas", "sqlalchemy"]        # non-SQLite databases for --map
all = ["vtk>=9.3", "h5py", "pandas", "openpyxl", "sqlalchemy"]
gallery = ["pillow"]                   # docs/build_gallery.py thumbnails
test = ["pytest", "pyflakes", "pyyaml", "vtk>=9.3", "h5py", "pillow"]   # pyyaml: test_docs_workflow

[project.scripts]
nastran-pv = "nastran_pv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
